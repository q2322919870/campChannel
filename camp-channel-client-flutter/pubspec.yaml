name: camp_channel_client_flutter
description: A new Flutter project for Camp Channel Client (PC, Web, and Android App).
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6

  # HTTP client
  dio: ^5.4.0

  # State management
  provider: ^6.1.1

  # Local persistence
  shared_preferences: ^2.2.2

  cached_network_image: ^3.3.0

  # Image picker for avatar upload
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  
  # Permission handler for runtime permissions
  permission_handler: ^11.3.0

  # Crypto for file hash calculation
  crypto: ^3.0.3

  # Video player
  video_player: ^2.8.1

  # Path provider
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

platform:
  android:
  ios:
